# Builds the Flutter app for Android, macOS, Linux and Windows, only when
# something under flutter/ (or this workflow) changes. Pushing a tag like
# app-v1.2.0 builds everything and attaches the files to a GitHub Release.
name: Flutter app

on:
  push:
    branches: [main]
    tags: ['app-v*']
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'

defaults:
  run:
    working-directory: flutter
    shell: bash

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      flags: ${{ steps.version.outputs.flags }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The binaries carry the tag's version (or the pubspec's) and the run
      # number as the build number, which only ever increases, so Android
      # version codes and installed versions advance with every build.
      - id: version
        name: Version
        run: |
          name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          label="$name-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            name="${GITHUB_REF#refs/tags/app-v}"
            if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME must look like app-v1.2.3"
              exit 1
            fi
            label="$name"
          fi
          echo "version=$label" >> "$GITHUB_OUTPUT"
          echo "flags=--build-name=$name --build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Signed with the template's debug key until a release keystore is set up.
      - run: flutter build apk --release ${{ needs.check.outputs.flags }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk "Reqall-${{ needs.check.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: flutter/Reqall-*-android.apk
          retention-days: 14

  macos:
    name: macOS DMG
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Ad-hoc signed, not notarized: first launch needs right-click → Open.
      - run: flutter build macos --release ${{ needs.check.outputs.flags }}
      - name: Package DMG
        run: |
          app="$(ls -d build/macos/Build/Products/Release/*.app | head -1)"
          staging="$(mktemp -d)"
          cp -R "$app" "$staging/Reqall.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Reqall -srcfolder "$staging" -ov -format UDZO \
            "Reqall-${{ needs.check.outputs.version }}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: flutter/Reqall-*-macos.dmg
          retention-days: 14

  linux:
    name: Linux bundle
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release ${{ needs.check.outputs.flags }}
      - run: tar -C build/linux/x64/release/bundle -czf "Reqall-${{ needs.check.outputs.version }}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: flutter/Reqall-*-linux-x64.tar.gz
          retention-days: 14

  windows:
    name: Windows zip
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release ${{ needs.check.outputs.flags }}
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Reqall-${{ needs.check.outputs.version }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: flutter/Reqall-*-windows-x64.zip
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [check, android, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Reqall app ${{ needs.check.outputs.version }}" --generate-notes
